  spec_url: https://api.solvela.ai/openapi.json
  base_url: https://api.solvela.ai
  policy_published: false
  note: >-
    No versioning policy page. The path carries /v1 and nothing has ever been /v2. The OpenAPI's info.version
    (0.1.0) and the agent card's version (0.2.0) are not the same number and neither is the gateway release
    number; the docs say the card's version "tracks the gateway release and changes over time". The served
    OpenAPI is byte-identical to docs/openapi.json in the repository by construction (include_str! plus a
    contract drift test), so the spec's history is the repository's git history. The company was formerly named
    RCR / RustyClawRouter; the changelog header still says so.
