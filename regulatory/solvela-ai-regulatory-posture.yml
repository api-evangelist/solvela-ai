summary: >-
  No horizontal regulatory signal reaches the bar this artifact requires — a page carrying the substance, not
  the word — so signals is empty and that emptiness is the measurement. The reason is structural rather than a
  gap in looking: Solvela's website, docs and app hosts (solvela.ai, docs.solvela.ai, app.solvela.ai) all answer
  HTTP 402 DEPLOYMENT_DISABLED from Vercel on every path, so no privacy policy, terms, subprocessor list, DPA,
  accessibility statement or transparency page is reachable there; the API host 404s the conventional paths; and
  the public repository carries no PRIVACY, TERMS or legal directory (only CODE_OF_CONDUCT.md). What the
  provider does publish, in its repository, is unusually candid engineering disclosure — a regulatory-position
  paper on how money flows, a data-persistence inventory, a security policy with response times, a free-tier
  data-use warning, a per-component license table — none of which is one of the fourteen canonical signals.
  They are recorded below as near-misses so a future sweep can see what was there and does not re-litigate it.
