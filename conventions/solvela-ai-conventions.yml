payment_quoting:
  currency: USDC-SPL on Solana mainnet (CAIP-2 solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp)
  units: accepts[].amount is atomic USDC (6 decimals) as a string; cost_breakdown values are decimal strings
  basis: quoted against the model's full completion-token ceiling (or max_tokens if set), so the quote is an upper bound; escrow and channel settle actual cost, exact charges the quote
  validity: max_timeout_seconds 300
  fee: platform fee 0% on the hosted gateway (software default 5%); every 402 carries fee_percent
  schemes_advertised: [exact, escrow]
  schemes_accepted_but_not_advertised: [channel voucher]
  discovery: [GET /.well-known/x402, GET /v1/supported, x-payment-info on the OpenAPI operation, extensions.bazaar in the 402 body]
streaming:
  rest: SSE (text/event-stream) when stream is true; for escrow the client may call POST /v1/escrow/settle after the stream ends to claim immediately
  a2a: not supported (message/stream not routed; card says streaming false)
caching:
  response_cache: exact-match on (model, messages, temperature), wallet-agnostic; a hit returns the prior answer at zero upstream cost
  semantic_cache: Tier 2 near-duplicate cache enabled on the hosted gateway 2026-07-14 (bge-small-en-v1.5 embeddings); an escrow request that hits it is billed less than quoted
  header: x-solvela-cache
routing:
  profiles: [eco, auto, premium, free]
  profile_aliases: {cheap: eco, budget: eco, balanced: auto, default: auto, best: premium, quality: premium, oss: free, open: free}
  model_aliases: [opus, sonnet, haiku, gpt5, gemini, flash, grok, deepseek, reasoner, o3-mini]
  model_id_form: '<provider>/<model> (NVIDIA NIM ids double the prefix, e.g. nvidia/nvidia/nemotron-nano-9b-v2)'
other_conventions:
- name: Money-free pre-checks
  detail: Prompt-guard (injection/jailbreak/PII) runs before any funds move on A2A; a blocked message costs nothing.
- name: Timeouts
  detail: 120 s per request (408); A2A serve bound 540 s.
- name: Content
  detail: Text and image_url content parts (vision models only, else 415); A2A is text-only.
- name: No PII
  detail: The provider states it never collects names, emails or identifiers and does not persist prompts or responses.
