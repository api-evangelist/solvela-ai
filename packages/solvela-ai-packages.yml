summary: >-
  All first-party. Four language SDKs (TypeScript, Python, Go, Rust) plus an MCP server, a Claude Code
  sidecar, shared signing primitives and the operator CLI, all developed in the public monorepo
  github.com/solvela-ai/solvela (the standalone solvela-ts / solvela-python / solvela-go repos were consolidated
  there 2026-05-12 and the Rust client 2026-05-16; the old repos remain as redirect stubs). The newest release
  on any registry is 2026-07-08 (TypeScript SDK 0.4.0, Python SDK 0.4.0, Go v0.5.0, MCP server 0.1.1); the
  gateway repo itself was last pushed 2026-09-18, so the SDKs trail the gateway by about ten weeks but still
  speak the live wire (the 402 observed today is x402_version 2, which 0.4.x parses; the provider's own note
  says releases before 0.2.2 cannot complete a payment). Libraries and SDKs are Apache-2.0; three older
  crates (solvela-cli, solvela-x402, solvela-router) still carry MIT metadata from before the 2026-05-31
  relicense, as the provider's license page says they would until their next release.
