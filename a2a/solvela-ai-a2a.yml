discovery:
  path: /.well-known/agent-card.json
  canonical: true
  host: api.solvela.ai
  note: >-
    Served from the API host, which is also the only OpenAPI servers[] host that resolves to Solvela's own
    domain (the second server, solvela-gateway.fly.dev, is the same Fly.io app under the platform's domain and
    serves a byte-identical card). The registrable domain solvela.ai and its docs/app subdomains answer HTTP 402
    text/plain "DEPLOYMENT_DISABLED" from Vercel on every path, including both agent-card paths, so nothing is
    discoverable there; www.solvela.ai has no DNS record. The legacy /.well-known/agent.json path on api.solvela.ai
    returns the same 1,454-byte document (the provider's changelog and README describe it as a deliberate
    backward-compatibility alias of the canonical path). A negative-control path that cannot exist
    (/.well-known/solvela-ai-negative-control-9c1f2a7e.json) returns a real 404 with an empty body, as do
    security.txt, openid-configuration, oauth-authorization-server and oauth-protected-resource, so the 200 on
    the card is a served document and not a catch-all. Ownership is not in question: the card's
    provider.organization is "Solvela" with provider.url https://solvela.ai, the OpenAPI on the same host titles
    itself "Solvela Gateway" with contact partnerships@solvela.ai, and the source that renders the card is public
    at github.com/solvela-ai/solvela (crates/gateway/src/a2a/agent_card.rs).
