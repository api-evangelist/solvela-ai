      description: AP2 merchant for AI agent LLM payments
      required: true
      params: {roles: [merchant]}
    - uri: https://github.com/google-a2a/a2a-x402/v0.1
      description: x402 on-chain settlement via Solana USDC-SPL
      required: true
      params: {network: solana, asset: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v, schemes: [exact, escrow]}
  skills: 1
  skill_list:
  - id: chat-completion
    name: Chat Completion
    tags: [llm, chat, completions, ai, x402]
    input_modes: [text/plain]
    output_modes: [text/plain]
    examples: 3
protocol_surface:
  endpoint: https://api.solvela.ai/a2a
  transport: JSON-RPC 2.0 over HTTPS POST
  methods_documented:
  - message/send — no taskId returns a Task in input-required state carrying the x402 PaymentRequired quote in metadata (x402.payment.required); with taskId and a payment payload it settles on-chain and returns a completed Task with the completion as artifact plus x402.payment.receipts
  - tasks/get — task state for roughly 10 minutes after the last state change (Redis TTL); the task id is a bearer capability, rate-limited per client IP
  - tasks/cancel — only while input-required (before any funds move); otherwise -32002 TaskNotCancelableError
  - tasks/pushNotificationConfig/* — always -32003 PushNotificationNotSupportedError
  - message/stream and tasks/resubscribe — not routed (-32601); the card truthfully says streaming false
  error_codes:
    '-32001': Task not found or expired
    '-32002': Task not cancelable
    '-32003': Push notifications not supported
    '-32007': Payment failed (replay, offer mismatch, verification or settlement failure)
    '-32008': Provider error
    '-32009': Model not found
  docs: https://github.com/solvela-ai/solvela/blob/main/dashboard/content/docs/concepts/a2a.mdx
  text_only: true
  payment: x402 v2, USDC-SPL on Solana mainnet (CAIP-2 solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp); schemes exact and escrow advertised, spend-down channel vouchers accepted but not advertised
