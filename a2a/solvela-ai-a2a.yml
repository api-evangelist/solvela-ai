agent_card:
  name: Solvela
  description: Solana-native AI agent payment gateway — pay for LLM API calls with USDC-SPL via x402
  url: https://api.solvela.ai/a2a
  version: 0.2.0
  protocol_version: 0.3.0
  preferred_transport: JSONRPC
  provider:
    organization: Solvela
    url: https://solvela.ai
  documentation_url: https://solvela.ai/docs
  icon_url: https://solvela.ai/logo.png
  default_input_modes: [text/plain]
  default_output_modes: [text/plain]
  capabilities:
    streaming: false
    push_notifications: false
    extensions:
