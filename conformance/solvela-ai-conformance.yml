- id: a2a-x402
  name: a2a-x402 payment extension
  version: v0.1
  conforms: true
  domain_standard_signature: true
  evidence: 'a2a/solvela-ai-agent-card.json capabilities.extensions[1].uri = https://github.com/google-a2a/a2a-x402/v0.1, required = true, params {network: solana, asset: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v, schemes: [exact, escrow]}. The docs describe x402.payment.required / x402.payment.payload / x402.payment.status / x402.payment.receipts message-metadata keys.'
