summary: >-
  Solvela's conformance profile is the agent-commerce protocol stack, and unusually for this catalog most of it
  was OBSERVED on the wire rather than read from a page: an x402 v2 402 challenge (body and PAYMENT-REQUIRED
  header) on POST /v1/chat/completions, /v1/messages and /v1/search; an /.well-known/x402 discovery document; an
  x-payment-info extension inside the served OpenAPI; an A2A 0.3.0 agent card declaring the a2a-x402 and AP2
  extensions as required, backed by a live JSON-RPC 2.0 responder; CAIP-2 network identifiers; and the
  Coinbase-style x402 Bazaar discovery block inside the 402 body. It also declares OpenAI Chat Completions and
  Anthropic Messages wire compatibility and ships an MCP server (stdio). It declares and serves none of the
  enterprise identity or hygiene standards: no OAuth 2 / OIDC, no RFC 9457 problem details, no RFC 9116
  security.txt (claimed in SECURITY.md but 404), no RFC 8594 deprecation signalling, no RFC 9727 API catalog, and
  no published SOC 2 / ISO 27001 style compliance programme — so no Compliance pointer is emitted.
standards:
- id: x402
  name: x402 HTTP payment protocol
  version: 2
  conforms: true
  verification: observed
  domain_standard_signature: true
  evidence: >-
    POST https://api.solvela.ai/v1/chat/completions without PAYMENT-SIGNATURE returned HTTP 402 with a JSON body
    {x402_version: 2, resource: {url, method}, accepts: [{scheme: exact, network: solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp,
    amount, asset: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v, pay_to, max_timeout_seconds: 300}, {scheme: escrow,
    ..., escrow_program_id}], cost_breakdown, error: "Payment required"} and a PAYMENT-REQUIRED response header
    carrying the canonical camelCase challenge base64-encoded. The same shape came back from POST /v1/messages
    and POST /v1/search. The OpenAPI declares the x402Payment security scheme (apiKey in header PAYMENT-SIGNATURE),
    a 402 response with the PAYMENT-REQUIRED header, and x-payment-info {protocols: [x402], price: {mode: dynamic,
    currency: USD, min: 0.000001, max: 1.00}} on createChatCompletion. GET /v1/supported returned
    {kinds: [{x402_version: 2, scheme: exact, network, asset}], gateway: Solvela, pricing_url: /v1/models}.
  note: >-
    The payment leg itself was not exercised — nothing was signed or purchased. The x402 spec's canonical field
    casing is camelCase; Solvela's body is snake_case with the canonical rendering in the header, which the
    contract states explicitly.
