  conforms: true
  verification: observed
  domain_standard_signature: true
  evidence: 'GET https://api.solvela.ai/.well-known/x402 -> 200 application/json {"version":1,"resources":["https://api.solvela.ai/v1/chat/completions"]}; saved to well-known/solvela-ai-x402.json. The provider''s changelog (2026-06-17) names x402scan''s discovery precedence (OpenAPI -> /.well-known/x402 -> endpoint-only) as the reason it was added.'
- id: x402-bazaar-extension
  name: x402 Bazaar discovery extension (extensions.bazaar in the 402 body)
  conforms: true
  verification: observed
  evidence: 'The live 402 body on /v1/chat/completions carries extensions.bazaar.info {input: {type: http, method: POST, bodyType: json}, output: {type: json, example}} and extensions.bazaar.schema (JSON Schema 2020-12 for the input body and output example). Absent from the header rendering, as the OpenAPI PaymentRequired.extensions description states.'
