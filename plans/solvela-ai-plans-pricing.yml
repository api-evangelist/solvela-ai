model: pay-per-request in USDC-SPL on Solana via x402; no account, no subscription, no minimum, no invoice; price per request
  = provider list price per token x tokens, quoted in the 402 challenge before anything runs
summary: 'Solvela publishes no tiers. Every paid request is priced per token at the upstream provider''s list price and settled
  on-chain in USDC at request time; the hosted gateway at api.solvela.ai runs with the platform fee suspended (fee_percent
  0 on /pricing, /v1/models and the live 402 — the software''s default is 5%, configurable on self-hosted gateways). GET /v1/models
  returned 44 models across 6 providers (anthropic 6, deepseek 3, google 4, nvidia 17, openai 10, xai 4): 27 paid and 17 free
  ($0/$0, served without any payment or wallet, rate-limited per IP and globally — see rate-limits/). Two marketplace tools
  are flat-priced per call. The 402 challenge quotes against the model''s full completion-token ceiling, so the quoted amount
  is an upper bound; escrow and channel schemes settle the actual cost and refund the remainder, the exact scheme charges
  the quote. Enterprise: API-key organisations with team budgets are offered, and self-hosting the gateway needs a commercial
  license above USD 1,000,000 revenue or for SaaS re-hosting (BUSL-1.1); no enterprise price is published.'
