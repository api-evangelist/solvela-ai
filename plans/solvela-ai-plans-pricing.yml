payment_schemes:
- scheme: exact
  description: Pre-signed USDC-SPL TransferChecked for the quoted amount; one on-chain transaction per request; charged the
    quote.
- scheme: escrow
  description: Deposit to a PDA vault of the Anchor escrow program; gateway claims the actual cost after delivery and the
    remainder refunds in the same transaction; if unclaimed within max_timeout_seconds the agent reclaims the deposit on-chain.
- scheme: channel (spend-down voucher)
  description: 'Fund once on-chain, sign a cumulative voucher per request, close to refund the unspent balance; not advertised
    in accepts[]. Hosted caps per the provider''s feature-state page: 100 USDC max deposit, 500 USDC/day refund cap.'
  advertised_in_402: false
enterprise:
  api_keys: Bearer keys prefixed solvela_k_, scoped to an organisation; org/team hierarchy, hourly/daily/monthly team budgets,
    audit logs, usage analytics
  price: null
  contact: partnerships@solvela.ai
  self_hosting_license: 'Gateway is BUSL-1.1 (MIT on 2030-05-02): free for non-production, internal first-party production
    and commercial use under USD 1,000,000 annual revenue derived from the gateway; a commercial license is required to offer
    it as a hosted/managed service or above that revenue. Libraries, SDKs, CLI and the escrow program are Apache-2.0.'
