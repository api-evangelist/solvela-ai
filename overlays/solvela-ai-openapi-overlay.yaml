    - {scope: global free tier, limit: 12, window: 60s}
    - {scope: per-IP receipt lookups, limit: 20, window: 60s}
    - {scope: gateway concurrency, limit: 256, window: in-flight}
    - {scope: request timeout, limit: 120, window: seconds, exhaustion_status: 408}
