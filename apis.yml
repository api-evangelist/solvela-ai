aid: solvela-ai
name: Solvela
description: 'Solvela is a Solana-native payment gateway for AI agents: an OpenAI-compatible LLM proxy at api.solvela.ai
  where every paid request is settled per call in USDC-SPL over the x402 protocol (HTTP 402 challenge, signed payment,
  retry) with no API key and no account, plus a trustless on-chain escrow scheme, a spend-down voucher channel,
  a 15-dimension smart router across 44 models from six upstream providers (OpenAI, Anthropic, Google, xAI, DeepSeek,
  NVIDIA NIM), an A2A 0.3.0 agent card, a stdio MCP server and SDKs in TypeScript, Python, Go and Rust. The gateway
  is open source (BUSL-1.1 gateway, Apache-2.0 libraries) at github.com/solvela-ai/solvela.'
